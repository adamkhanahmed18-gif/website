    <stop offset="0%"   stop-color="#1a3f78" stop-opacity="0.6"/>
    <stop offset="38%"  stop-color="#0e2248" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#020710" stop-opacity="0"/>
